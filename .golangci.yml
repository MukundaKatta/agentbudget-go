# golangci-lint config for agentbudget-go.
# Conservative ruleset since this is a small stdlib-only library.

run:
  timeout: 5m
  go: '1.21'

linters:
  disable-all: true
  enable:
    - errcheck         # unchecked error returns
    - gosimple         # simplification hints
    - govet            # standard Go vet checks
    - ineffassign      # detect ineffectual assignments
    - staticcheck      # comprehensive static analysis
    - unused           # unused symbols
    - misspell         # spelling in comments/strings
    - gofmt            # formatting
    - revive           # more configurable replacement for golint

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"

issues:
  exclude-rules:
    # Test files are allowed to use long lines and skip some checks
    - path: _test\.go
      linters:
        - errcheck
